syntax = "proto3";

package mmorpg.network;

// NOCTHEMAR-specific messages. Imported by network.proto.
// Numbering convention: oneof members of ClientMessage / ServerMessage that belong to this file start at 100,
// and fields NOCTHEMAR adds to existing network.proto messages continue the existing numbering.

// Authoritative progression state of the local player.
message NocSnapshot {
  int32 level = 1;
  // XP accumulated toward the next level.
  int64 xp = 2;
  // XP needed to go from `level` to the next one; 0 at max level.
  int64 xp_to_next = 3;
  int32 mana = 4;
  int32 max_mana = 5;
  // Id of the character's race (Races.json). 0 = default race, which is also what an absent field decodes to.
  int32 race_id = 6;
  // Id of the chosen class (Classes.json); absent until one is chosen.
  optional int32 class_id = 7;
  // Skill points earned and not spent yet.
  int32 skill_points = 8;
  // Ids of the learned skills (Skills.json), ascending.
  repeated int32 skills = 9;
  // Learned mimicry abilities (Mimic.json ids), ascending; empty when none or when the world has no mimicry.
  repeated NocMimicState mimics = 10;
  // Equipped mimicry abilities in bar order (at most `mimic_slots`).
  repeated int32 mimic_equipped = 11;
  // Mimicry bar slots available now (level and passives); 0 when the world has no mimicry.
  int32 mimic_slots = 12;
  // Faction the character joined (Factions.json id); absent until one is joined.
  optional int32 faction_id = 13;
  // Reputation with each faction that moved away from 0, ascending by faction id; empty when none.
  repeated NocReputation reputations = 14;
  // 15 and 16 are reserved for the quest log (T84).
}

message NocReputation {
  int32 faction_id = 1;
  // -10000..10000.
  int32 value = 2;
}

// One learned mimicry ability.
message NocMimicState {
  int32 id = 1;
  // Total experience of the ability.
  int64 xp = 2;
  // 1..max level of the catalog's thresholds.
  int32 level = 3;
}

// Sent once, inside AuthenticateRequest, to create a character. Ignored by the server when a save already exists for the id
// (race is immutable). Plain int32 for the appearance axes because network.proto, which owns the enums, imports this file;
// values are those of PlayerGender / PlayerSkinColor and the hair (0-7) and underwear (0-7) indices of ChangePlayerAppearanceRequest.
message NocCharacterCreation {
  int32 race_id = 1;
  // PlayerGender: 0 = male, 1 = female.
  int32 gender = 2;
  // PlayerSkinColor: 0 = light, 1 = tanned, 2 = dark.
  int32 skin_color = 3;
  int32 hair_style_index = 4;
  int32 underwear_color_index = 5;
}

// Debug only: the server ignores it unless Settings.json nocthemar.debug is true.
message NocGrantXpRequest {
  int64 amount = 1;
}

// Chooses the class. The server refuses it (NocActionRefused) when a class was already chosen or the id is unknown.
message NocChooseClassRequest {
  int32 class_id = 1;
}

// Learns one skill of the character's class; refused (NocActionRefused) when a rule is not met. Accepted: the next NocStateUpdated carries the new skills and points.
message NocLearnSkillRequest {
  int32 skill_id = 1;
}

// Debug only: forgets every learned skill (the class stays). Ignored unless Settings.json nocthemar.debug is true.
message NocRespecRequest {
}

// Debug only: puts `quantity` units of an item in the sender's bag (1..100). Ignored (and logged) unless Settings.json nocthemar.debug is true;
// an unknown item or a quantity out of range is answered with NocActionRefused.
message NocCreateItemRequest {
  int32 item_id = 1;
  int32 quantity = 2;
}

// Soul Forge, consume: learns the ability of an essence from the bag and removes the essence. Refused (NocActionRefused) when no Soul Forge is in range or a rule is not met.
message NocForgeConsumeRequest {
  int32 ability_id = 1;
}

// Soul Forge, fuse: two essences from the bag become the ability of their recipe. Same refusals as the consume request.
message NocForgeFuseRequest {
  int32 ability_a = 1;
  int32 ability_b = 2;
}

// Puts a learned ability on the mimicry bar (`equipped` true) or takes it off. Needs no Soul Forge. Accepted: the next NocStateUpdated carries the new bar.
message NocMimicEquipRequest {
  int32 ability_id = 1;
  bool equipped = 2;
}

// Join a faction at one of its masters (an NPC of that faction within range). Refused when the sender is dead, already has a faction, is under the join level or no master is in range. Accepted: the next NocStateUpdated carries the faction, nearby players receive PlayerFactionChanged.
message NocFactionJoinRequest {
  int32 faction_id = 1;
}

// Debug only (nocthemar.debug): adds `delta` (may be negative) to the sender's reputation with a faction.
message NocReputationAddRequest {
  int32 faction_id = 1;
  int32 delta = 2;
}

// Sent to the sender only when a NOCTHEMAR request is refused; `reason` is a short English sentence meant to be shown to the player.
message NocActionRefused {
  string reason = 1;
}

message NocBranchInfo {
  // 0-2, the order of the branches inside the class.
  int32 id = 1;
  string key = 2;
  string name = 3;
  string role = 4;
}

message NocClassInfo {
  int32 id = 1;
  string key = 2;
  string name = 3;
  string role = 4;
  repeated NocBranchInfo branches = 5;
  // Races (Races.json ids) the class is recommended for. Only a hint for the UI: the server accepts any race x class pair.
  repeated int32 recommended_race_ids = 6;
}

message NocSkillInfo {
  // 1000 + class * 100 + branch * 10 + slot.
  int32 id = 1;
  string key = 2;
  string name = 3;
  int32 class_id = 4;
  int32 branch = 5;
  // 0-7 inside the branch (slot 7 is the ultimate).
  int32 slot = 6;
  // Character level required.
  int32 level = 7;
  // 0 = passive, 1 = active, 2 = ultimate.
  int32 kind = 8;
  // Skill points to learn it.
  int32 cost = 9;
  string desc = 10;
  // False: listed in the tree but not learnable yet.
  bool ready = 11;
  // Id of the skill that must be learned first; 0 = none.
  int32 prerequisite_id = 12;
}

// One mimicry ability of the catalog (a monster ability or a fusion result).
message NocMimicInfo {
  // 2000-2099 monster abilities, 2100-2199 fusion results.
  int32 id = 1;
  string key = 2;
  string name = 3;
  // 0 offensive, 1 defensive, 2 utility, 3 control, 4 ultimate.
  int32 kind = 4;
  // 0 common, 1 rare, 2 epic, 3 legendary, 4 mythic.
  int32 rarity = 5;
  // Name of the source monster; empty for a fusion result.
  string monster_name = 6;
  // Classes allowed to learn and equip it; empty = every class.
  repeated int32 class_ids = 7;
  // The essence only drops in raid worlds.
  bool requires_raid = 8;
  int32 cooldown_ms = 9;
  int32 mana_cost = 10;
  string desc = 11;
  // False: listed but not castable yet.
  bool ready = 12;
  // Items.json id of the essence; 0 for a fusion result (it has no essence).
  int32 essence_item_id = 13;
}

// Two monster abilities that fuse into a third; `a` is the lower id.
message NocFusionInfo {
  int32 a = 1;
  int32 b = 2;
  int32 result = 3;
}

// Static classes, skills and mimicry, sent once at the first join of a session (not again on world transfers).
message NocCatalog {
  repeated NocClassInfo classes = 1;
  repeated NocSkillInfo skills = 2;
  // Empty when the world has no mimicry catalog.
  repeated NocMimicInfo mimics = 3;
  repeated NocFusionInfo fusions = 4;
  // Total ability experience needed for level i + 2; the maximum level is the count + 1.
  repeated int64 mimic_xp_thresholds = 5;
  // Power of an ability is 1 + this x (level - 1).
  double mimic_power_per_level = 6;
  // Mimicry bar slots: `mimic_slots_first` at level 1, one more every `mimic_levels_per_slot` levels, up to `mimic_slots_max` (passives can add a few on top; NocSnapshot.mimic_slots is the current total). 0 without mimicry.
  int32 mimic_slots_first = 7;
  int32 mimic_levels_per_slot = 8;
  int32 mimic_slots_max = 9;
  // Empty when the world has no faction catalog.
  repeated NocFactionInfo factions = 10;
  NocReputationRules reputation_rules = 11;
  // 12 is reserved for the quest catalog (T84).
}

message NocFactionInfo {
  int32 id = 1;
  string key = 2;
  string name = 3;
  string hq = 4;
  string symbol = 5;
  // CSS colors (#rrggbb); the first one is the faction's display color.
  repeated string colors = 6;
  repeated int32 rivals = 7;
  string desc = 8;
  // Perks gained at each tier (only that tier's; a member cumulates the lower ones).
  repeated NocFactionPerk perks = 9;
}

message NocFactionPerk {
  // ReputationTier: 0 hostile, 1 neutral, 2 friendly, 3 honored, 4 exalted.
  int32 tier = 1;
  repeated NocPerkModifier modifiers = 2;
}

message NocPerkModifier {
  // StatId.
  int32 stat = 1;
  // ModifierKind: 0 flat, 1 percent add, 2 percent mult.
  int32 kind = 2;
  double value = 3;
}

message NocReputationRules {
  int32 min = 1;
  int32 max = 2;
  // Minimum character level to join a faction.
  int32 join_level = 3;
  // Reputation base of a monster kill (a monster's repOnKill replaces it).
  int32 kill_base = 4;
  // Lowest value of each tier above hostile.
  int32 neutral = 5;
  int32 friendly = 6;
  int32 honored = 7;
  int32 exalted = 8;
}

// Self only. At most one per world tick and player (other state messages such as HpUpdated may accompany it); the state is the latest one at the end of that tick (last state wins).
message NocStateUpdated {
  NocSnapshot state = 1;
}
