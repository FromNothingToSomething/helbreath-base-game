name: Proto round-trip (C# -> TS)

# T23: C# encodes the canonical message, TS and Python (3rd implementation) decode it, and all are compared with the committed binary fixture.
# Until T23 lands, the prerequisites job only warns and the round-trip jobs are skipped; they run automatically once every file exists.
# No server or client is started: only the serialized bytes cross the language boundary.
on:
  push:
    paths:
      - multiplayer/proto/network.proto
      - multiplayer/proto/nocthemar.proto
      - multiplayer/Nocthemar.Tests/ProtoFixtureTests.cs
      - multiplayer/Nocthemar.Tests/Fixtures/proto/**
      - tools/proto-roundtrip/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proto-roundtrip-${{ github.ref }}
  cancel-in-progress: true

env:
  FIXTURE_DIR: multiplayer/Nocthemar.Tests/Fixtures/proto
  FIXTURE_BIN: noc_state_updated.bin
  FIXTURE_EXPECTED: expected.json

jobs:
  prerequisites:
    name: Check T15/T23 files exist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      # Until T23 lands this only warns (the job stays green and the round-trip jobs are skipped); once every file exists the jobs run and can fail.
      - name: Verify required files
        id: check
        run: |
          missing=0
          for f in \
            multiplayer/proto/nocthemar.proto \
            multiplayer/Nocthemar.Tests/ProtoFixtureTests.cs \
            "$FIXTURE_DIR/$FIXTURE_BIN" \
            "$FIXTURE_DIR/$FIXTURE_EXPECTED" \
            tools/proto-roundtrip/decode.ts \
            tools/proto-roundtrip/decode.py; do
            if [ ! -f "$f" ]; then echo "::warning::missing $f (T23 not committed yet): round-trip skipped"; missing=1; fi
          done
          if [ "$missing" -eq 0 ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi

  encode-cs:
    name: Encode in C# and compare with fixture
    needs: prerequisites
    if: needs.prerequisites.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore multiplayer/Nocthemar.Tests/Nocthemar.Tests.csproj

      # ProtoFixtureTests encodes the canonical ServerMessage, writes it to NOC_FIXTURE_OUT, and asserts the bytes equal the committed fixture.
      - name: Encode and compare
        env:
          NOC_FIXTURE_OUT: ${{ runner.temp }}/fixture-cs
        run: >
          dotnet test multiplayer/Nocthemar.Tests/Nocthemar.Tests.csproj
          --configuration Release --no-restore
          --filter "FullyQualifiedName~ProtoFixtureTests"

      - name: Upload C# encoded bytes
        uses: actions/upload-artifact@v4
        with:
          name: fixture-cs
          path: ${{ runner.temp }}/fixture-cs/${{ env.FIXTURE_BIN }}
          if-no-files-found: error

  decode-ts:
    name: Decode in TS and compare
    needs: [prerequisites, encode-cs]
    if: needs.prerequisites.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install client dependencies and generate TS stubs
        working-directory: multiplayer/mp-client
        run: |
          pnpm install --frozen-lockfile
          pnpm run proto:generate

      - name: Install tools dependencies (tsx)
        working-directory: tools
        run: pnpm install --frozen-lockfile

      - name: Download C# encoded bytes
        uses: actions/download-artifact@v4
        with:
          name: fixture-cs
          path: ${{ runner.temp }}/fixture-cs

      - name: Bytes from C# are identical to the committed fixture
        run: cmp "${{ runner.temp }}/fixture-cs/${FIXTURE_BIN}" "${FIXTURE_DIR}/${FIXTURE_BIN}"

      # decode.ts decodes both files with the generated TS types and exits non-zero unless the result equals expected.json.
      - name: Decode C# bytes
        working-directory: tools
        run: >
          node --import tsx ./proto-roundtrip/decode.ts
          --bin "${{ runner.temp }}/fixture-cs/${FIXTURE_BIN}"
          --expected "../${FIXTURE_DIR}/${FIXTURE_EXPECTED}"

      - name: Decode committed fixture
        working-directory: tools
        run: >
          node --import tsx ./proto-roundtrip/decode.ts
          --bin "../${FIXTURE_DIR}/${FIXTURE_BIN}"
          --expected "../${FIXTURE_DIR}/${FIXTURE_EXPECTED}"

  # Third, independent implementation: protobuf-python decodes the bytes produced by C# and the committed fixture (no .NET, no Node).
  decode-py:
    name: Decode in Python and compare
    needs: [prerequisites, encode-cs]
    if: needs.prerequisites.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # grpcio-tools brings a protoc and a matching protobuf runtime.
      - name: Install protobuf tooling
        run: pip install grpcio-tools

      - name: Generate Python stubs
        run: |
          mkdir -p "${{ runner.temp }}/py-gen"
          python -m grpc_tools.protoc -I multiplayer/proto --python_out="${{ runner.temp }}/py-gen" multiplayer/proto/network.proto multiplayer/proto/nocthemar.proto

      - name: Download C# encoded bytes
        uses: actions/download-artifact@v4
        with:
          name: fixture-cs
          path: ${{ runner.temp }}/fixture-cs

      - name: Decode C# bytes
        run: >
          python tools/proto-roundtrip/decode.py
          --gen "${{ runner.temp }}/py-gen"
          --bin "${{ runner.temp }}/fixture-cs/${FIXTURE_BIN}"
          --expected "${FIXTURE_DIR}/${FIXTURE_EXPECTED}"

      - name: Decode committed fixture
        run: >
          python tools/proto-roundtrip/decode.py
          --gen "${{ runner.temp }}/py-gen"
          --bin "${FIXTURE_DIR}/${FIXTURE_BIN}"
          --expected "${FIXTURE_DIR}/${FIXTURE_EXPECTED}"
