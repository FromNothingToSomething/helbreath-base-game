name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (.NET) + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Existing protobuf field numbers are frozen (additions are fine): compares against tools/proto-baseline/network.fields.txt.
      - name: Proto field numbers unchanged
        run: python3 tools/proto_fields.py check tools/proto-baseline/network.fields.txt multiplayer/proto/network.proto multiplayer/proto/nocthemar.proto

      # Restoring the test project also restores Server.csproj (ProjectReference).
      - name: Restore
        run: dotnet restore multiplayer/Nocthemar.Tests/Nocthemar.Tests.csproj

      - name: Build server
        run: dotnet build multiplayer/server/Server.csproj --configuration Release --no-restore

      - name: Build tests
        run: dotnet build multiplayer/Nocthemar.Tests/Nocthemar.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test multiplayer/Nocthemar.Tests/Nocthemar.Tests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=nocthemar-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  client:
    name: Client (mp-client build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: multiplayer/mp-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm 9 matches lockfileVersion 9.0 and runs dependency install scripts by default (grpc-tools downloads protoc in its postinstall).
      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `prebuild` runs proto:generate first.
      - name: Build
        run: pnpm build

  # Pure client logic (snapshot -> view model) and the wire format as decoded by the generated TS code; no browser, no server.
  client-logic:
    name: Client logic tests (tsx)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate TS stubs
        run: pnpm run proto:generate

      - name: Test
        run: node --import tsx --test noc-client-tests/*.test.ts
